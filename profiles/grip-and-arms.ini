toolchange_gcode = {if not (layer_num < 0 )} \n  {\n  local speed_tc = min(travel_speed, 350.0) * 60;\n  local deretract_length = 1.0 * retract_toolchange + retract_length[next_extruder];\n  local target_temp = temperature[next_extruder];\n  local eject_temp = max(160,target_temp - 60);\n  local filament_area = 3.14 * filament_diameter[next_extruder] * filament_diameter[next_extruder] / 4.0;\n  local purge_mm = max(3.0, filament_minimal_purge_on_wipe_tower[next_extruder] * 1.0 / filament_area);\n  local purge_speed_fast = 60.0 * min(6,max(1.5,0.6*filament_max_volumetric_speed[next_extruder]/filament_area));\n  local purge_speed_slow = 60.0 * min(3,max(1.5,0.3*filament_max_volumetric_speed[next_extruder]/filament_area));\n  local tc_retract_speed = 60.0 * min(30,max(10,retract_speed[current_extruder]));\n  local tc_deretract_speed = 60.0 * min(20,max(5,deretract_speed[next_extruder]));\n  }\n\n  {if filament_minimal_purge_on_wipe_tower[next_extruder] == 0}\n    {purge_mm = 5.0}\n  {endif}\n\n  {if filament_flush_volume[next_extruder] > 0}\n    {purge_mm = max(3.0, filament_flush_volume[next_extruder] / filament_area)}\n  {endif}\n\n  {if filament_flush_speed[next_extruder] > 0}\n    {purge_speed_fast = 60.0 * min(10,max(1,filament_flush_speed[next_extruder]))}\n    {purge_speed_slow = 60.0 * min(10,max(1,filament_flush_speed[next_extruder] / 2))}\n  {endif}\n\n  {if filament_type[current_extruder]=="FLEX"}\n    {tc_retract_speed = 60*15}\n  {endif}\n\n  {if filament_type[next_extruder]=="FLEX"}\n    {tc_deretract_speed = 60*10}\n  {endif}\n\n  {if !is_nil(filament_retract_length_toolchange[next_extruder])}\n    {deretract_length = retract_toolchange + filament_retract_length_toolchange[next_extruder]}\n  {endif}\n\n  {if tool_init[next_extruder] == 0}\n    {deretract_length = 1.6}\n  {endif}\n\n  {if layer_z <= (first_layer_height + 0.0001)}\n    {target_temp = first_layer_temperature[next_extruder]}\n  {endif}\n\n  ; Change Tool[previous_extruder] -> Tool[next_extru